<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liv — robot preview</title>
    <style>
      html, body { margin: 0; background: #17181b; color: #d9dbe0; font: 12px system-ui, "Segoe UI", sans-serif; }
      #bar {
        position: sticky; top: 0; z-index: 1; display: flex; gap: 18px; align-items: center;
        padding: 10px 16px; background: #17181b; border-bottom: 1px solid #2c2e33;
      }
      #bar label { display: flex; gap: 6px; align-items: center; }
      #bar button { font: inherit; }
      #bar .hint { color: #8e939c; }
      #stage { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; padding: 16px; }
      .panel { padding: 12px 16px 16px; border-radius: 12px; }
      .panel.black { background: #000; }
      .panel.grey { background: #7f8084; color: #101114; }
      .panel h2 { margin: 0 0 4px; font: 600 13px system-ui, "Segoe UI", sans-serif; }
      .panel h3 { margin: 14px 0 2px; font: 600 12px system-ui, "Segoe UI", sans-serif; opacity: 0.75; }
      .panel table { border-collapse: collapse; }
      .panel th { font-weight: 400; opacity: 0.7; padding: 2px 6px; text-align: center; }
      .panel th.state { text-align: right; }
      .panel td { padding: 0; text-align: center; vertical-align: middle; }
      .panel canvas { display: block; margin: 0 auto; }
      .strip { display: flex; gap: 10px; align-items: flex-end; }
      .strip figure { margin: 0; text-align: center; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="stage"></div>
    <script type="module" src="./robot-preview.ts"></script>
  </body>
</html>
