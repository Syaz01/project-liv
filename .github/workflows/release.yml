# Builds the Windows installer when a tag `windows-vX.Y.Z` is pushed, and
# attaches it to a DRAFT release: nothing is public until someone reviews the
# draft on GitHub and publishes it. The tag's version must be the one in
# src-tauri/tauri.conf.json (the app's updater reads these tags, update.rs).
#
# The installer is not code-signed: Windows SmartScreen warns the first time
# it is run. Only GitHub's own actions are used.
name: Release

on:
  push:
    tags: ["windows-v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: The tag is the app's version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "windows-v$version") {
            throw "Tag ${{ github.ref_name }} does not match version $version in tauri.conf.json"
          }

      - run: npm ci

      - name: Tests
        run: |
          npm run build
          npm test
          cargo test --workspace --locked

      - name: Build the installer
        run: npm run pack

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --draft --title "Liv ${{ github.ref_name }}" --generate-notes
